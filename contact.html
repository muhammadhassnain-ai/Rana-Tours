<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rana Tours</title>
    <link rel="stylesheet" href="travelRecommendation/travel_recommendation.css">
    <link rel="stylesheet" href="travelRecommendation/contact.css">
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <header class="navbar">
        <div class="logo">
            <img src="https://img.icons8.com/?size=64&id=17486&format=png" alt="logo">
            <span>Rana Tours</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <!-- ===== MAIN CONTACT SECTION ===== -->
    <main class="contact-container">
        
        <!-- Left Social Icons -->
        <div class="social-icons">
            <div class="vertical-line"></div>
            <a href="#"><img src="https://img.icons8.com/?size=64&id=jlpBF1fJe9fs&format=png" alt="twitter"></a>
            <a href="#"><img src="https://img.icons8.com/?size=64&id=118484&format=png" alt="facebook"></a>
            <a href="#"><img src="https://img.icons8.com/?size=64&id=32320&format=png" alt="instagram"></a>
            <a href="#"><img src="https://img.icons8.com/?size=64&id=15979&format=png" alt="youtube"></a>
        </div>

        <!-- Left Text -->
        <div class="contact-text">
            <h1>CONTACT US</h1>
            <p>Get in touch</p>
        </div>

        <!-- Right Form Box - Red Box -->
        <div class="contact-form-box">
            <form id="contactForm">
                
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Enter your message"></textarea>

                <button type="submit" class="submit-btn">Submit</button>
                
            </form>
        </div>

    </main>

    <script src="travelRecommendation/contact.js"></script>
</body>
</html>
